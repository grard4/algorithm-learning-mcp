name: Isolated quality checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-quality.txt
      - run: python -m compileall -q -x "[\\/]\." .
      - run: python -m ruff check --select E9,F63,F7,F82 .
      - run: python -m pytest -ra --cov=. --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - run: python scripts/round2_resource_probe.py --output resource-probe.json
      - run: python scripts/v022_resource_probe.py --output v022-resource-probe.json
      - run: python scripts/v022_upgrade_smoke.py --output v022-upgrade-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml
            resource-probe.json
            v022-resource-probe.json
            v022-upgrade-smoke.json
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-quality.txt
      - run: python -m pip_audit --progress-spinner off --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
